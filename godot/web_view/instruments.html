<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Suit Instruments</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07070e;
      color: #d8d8e0;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      padding: 20px;
      min-height: 100vh;
      max-width: 500px;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 18px;
      border-bottom: 1px solid #1c1c28;
      padding-bottom: 12px;
    }

    h1 {
      color: #ffa000;
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: normal;
      white-space: nowrap;
    }

    #status {
      font-size: 11px;
      color: #555;
    }
    #status.connected    { color: #00ffcc; }
    #status.disconnected { color: #ff4040; }

    #mode-badge {
      font-size: 10px;
      letter-spacing: 2px;
      padding: 2px 7px;
      border: 1px solid currentColor;
      border-radius: 2px;
      white-space: nowrap;
    }
    #mode-badge.GROUNDED { color: #606080; border-color: #606080; }
    #mode-badge.AIRBORNE { color: #ffa000; border-color: #ffa000; }
    #mode-badge.FLIGHT   { color: #00ffcc; border-color: #00ffcc; }

    /* ── Main instrument row ─────────────────────────────────────────── */

    .main-row {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      align-items: center;
    }

    /* Speed gauge */
    #speed-canvas {
      display: block;
      flex-shrink: 0;
    }

    /* Right-side readouts */
    .right-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .readout {
      background: #0e0e1a;
      border-left: 2px solid #1c1c28;
      padding: 8px 12px;
    }

    .readout-lbl {
      font-size: 9px;
      letter-spacing: 2px;
      color: #606080;
      margin-bottom: 4px;
    }

    .readout-val {
      font-size: 20px;
      letter-spacing: 1px;
      color: #d8d8e0;
    }

    #vspeed-val.climbing   { color: #00ffcc; }
    #vspeed-val.descending { color: #ffa000; }
    #vspeed-val.neutral    { color: #606080; }

    /* ── VSI bar ─────────────────────────────────────────────────────── */

    .section {
      margin-bottom: 14px;
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 2px;
      color: #606080;
      margin-bottom: 6px;
    }

    .vsi-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vsi-scale {
      font-size: 9px;
      color: #333;
      white-space: nowrap;
    }

    .vsi-track {
      position: relative;
      flex: 1;
      height: 10px;
      background: #0e0e1a;
      overflow: hidden;
    }

    .vsi-center {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: 100%;
      background: #303050;
    }

    #vsi-fill {
      position: absolute;
      top: 0;
      height: 100%;
      transition: all 0.08s linear;
    }

    /* ── Gauge bars ──────────────────────────────────────────────────── */

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .bar-lbl {
      font-size: 9px;
      letter-spacing: 2px;
      color: #606080;
      width: 52px;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 8px;
      background: #0e0e1a;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      transition: width 0.12s linear, background-color 0.3s;
    }

    .bar-pct {
      font-size: 11px;
      color: #606080;
      width: 36px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Footer stats ────────────────────────────────────────────────── */

    .footer {
      border-top: 1px solid #1c1c28;
      padding-top: 12px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-lbl {
      font-size: 9px;
      letter-spacing: 2px;
      color: #606080;
    }

    .stat-val {
      font-size: 13px;
      color: #d8d8e0;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<header>
  <h1>▸ SUIT INSTRUMENTS</h1>
  <span id="mode-badge" class="GROUNDED">GROUNDED</span>
  <span id="status">CONNECTING…</span>
</header>

<!-- Speed gauge + readouts -->
<div class="main-row">
  <canvas id="speed-canvas" width="220" height="220"></canvas>
  <div class="right-col">
    <div class="readout">
      <div class="readout-lbl">ALTITUDE</div>
      <div class="readout-val" id="altitude-val">— m</div>
    </div>
    <div class="readout">
      <div class="readout-lbl">V / SPEED</div>
      <div class="readout-val neutral" id="vspeed-val">— m/s</div>
    </div>
    <div class="readout">
      <div class="readout-lbl">HEADING</div>
      <div class="readout-val" id="heading-val">—°</div>
    </div>
  </div>
</div>

<!-- Vertical speed indicator (bidirectional bar) -->
<div class="section">
  <div class="section-label">VERTICAL SPEED INDICATOR</div>
  <div class="vsi-row">
    <span class="vsi-scale">▼ 50</span>
    <div class="vsi-track">
      <div class="vsi-center"></div>
      <div id="vsi-fill"></div>
    </div>
    <span class="vsi-scale">50 ▲</span>
  </div>
</div>

<!-- Energy / load / thermal bars -->
<div class="section">
  <div class="section-label">POWER SYSTEMS</div>
  <div class="bar-row">
    <span class="bar-lbl">HOVER</span>
    <div class="bar-track"><div class="bar-fill" id="energy-fill"></div></div>
    <span class="bar-pct" id="energy-pct">—%</span>
  </div>
  <div class="bar-row">
    <span class="bar-lbl">LOAD</span>
    <div class="bar-track"><div class="bar-fill" id="load-fill"></div></div>
    <span class="bar-pct" id="load-pct">—%</span>
  </div>
  <div class="bar-row">
    <span class="bar-lbl">THERMAL</span>
    <div class="bar-track"><div class="bar-fill" id="thermal-fill"></div></div>
    <span class="bar-pct" id="thermal-pct">—%</span>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <div class="stat">
    <span class="stat-lbl">BOOST CAP</span>
    <span class="stat-val" id="boost-cap">— m/s</span>
  </div>
  <div class="stat">
    <span class="stat-lbl">CEILING</span>
    <span class="stat-val" id="ceiling-val">—</span>
  </div>
  <div class="stat">
    <span class="stat-lbl">POSITION</span>
    <span class="stat-val" id="position-val">—</span>
  </div>
</div>

<script>
// ── Constants ───────────────────────────────────────────────────────────────

const GAUGE_MAX   = 90;   // m/s display maximum
const VSI_MAX     = 50;   // m/s max for VSI bar each side
const ZONE_SPRINT = 60;   // m/s where sprint zone ends / red begins
const ZONE_NORMAL = 30;   // m/s where normal zone ends / amber begins

// ── Gauge drawing ────────────────────────────────────────────────────────────

const canvas = document.getElementById('speed-canvas');
const ctx    = canvas.getContext('2d');
const CX = canvas.width / 2;
const CY = canvas.height / 2;
const R  = 80;   // arc radius

// Canvas angles: 0 = right, π/2 = down (y-axis flipped).
// Clock 7:30 (225°) → canvas 135° = 3π/4.
// Full gauge sweeps 270° clockwise from 3π/4 to 9π/4 (= π/4 mod 2π).
const A_START = 3 * Math.PI / 4;
const A_SWEEP = 3 * Math.PI / 2;

function angleForSpeed(speed) {
  return A_START + Math.min(speed / GAUGE_MAX, 1.05) * A_SWEEP;
}

function arcColor(speed) {
  if (speed <= ZONE_NORMAL) return '#00ffcc';
  if (speed <= ZONE_SPRINT) return '#ffa000';
  return '#ff4040';
}

function drawGauge(speed) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background arc
  ctx.beginPath();
  ctx.arc(CX, CY, R, A_START, A_START + A_SWEEP, false);
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Subtle zone hints (very low opacity arcs behind fill)
  const zones = [
    [0,           ZONE_NORMAL,  'rgba(0,255,204,0.12)'],
    [ZONE_NORMAL, ZONE_SPRINT,  'rgba(255,160,0,0.10)'],
    [ZONE_SPRINT, GAUGE_MAX,    'rgba(255,64,64,0.10)'],
  ];
  zones.forEach(([lo, hi, color]) => {
    ctx.beginPath();
    ctx.arc(CX, CY, R, angleForSpeed(lo), angleForSpeed(hi), false);
    ctx.strokeStyle = color;
    ctx.lineWidth = 14;
    ctx.lineCap = 'butt';
    ctx.stroke();
  });

  // Speed fill arc
  if (speed > 0.1) {
    ctx.beginPath();
    ctx.arc(CX, CY, R, A_START, angleForSpeed(speed), false);
    ctx.strokeStyle = arcColor(speed);
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Tick marks (at 0, 20, 40, 60, 80 m/s)
  [0, 20, 40, 60, 80].forEach(v => {
    const a  = angleForSpeed(v);
    const isRed = v >= ZONE_SPRINT;
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(R - 14, 0);
    ctx.lineTo(R + 2, 0);
    ctx.strokeStyle = isRed ? '#ff4040' : (v >= ZONE_NORMAL ? '#ffa000' : '#00ffcc');
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'square';
    ctx.stroke();

    // Label
    ctx.font = '9px "Courier New"';
    ctx.fillStyle = '#606080';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(v, R + 16, 0);
    ctx.restore();
  });

  // Needle
  const needleAngle = angleForSpeed(speed);
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(needleAngle);
  // Tail (short opposite direction)
  ctx.beginPath();
  ctx.moveTo(-12, 0);
  ctx.lineTo(R - 16, 0);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();

  // Center hub
  ctx.beginPath();
  ctx.arc(CX, CY, 5, 0, 2 * Math.PI);
  ctx.fillStyle = '#ffa000';
  ctx.fill();

  // Center digital value
  ctx.font = 'bold 26px "Courier New"';
  ctx.fillStyle = '#d8d8e0';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(speed.toFixed(1), CX, CY + 28);

  ctx.font = '9px "Courier New"';
  ctx.fillStyle = '#606080';
  ctx.letterSpacing = '2px';
  ctx.fillText('m/s', CX, CY + 46);

  ctx.font = '9px "Courier New"';
  ctx.fillStyle = '#606080';
  ctx.fillText('SPEED', CX, CY - 62);
}

// ── DOM helpers ──────────────────────────────────────────────────────────────

const STATUS    = document.getElementById('status');
const MODE      = document.getElementById('mode-badge');
const ALT_VAL   = document.getElementById('altitude-val');
const VSPD_VAL  = document.getElementById('vspeed-val');
const HDG_VAL   = document.getElementById('heading-val');
const VSI_FILL  = document.getElementById('vsi-fill');
const EN_FILL   = document.getElementById('energy-fill');
const EN_PCT    = document.getElementById('energy-pct');
const LD_FILL   = document.getElementById('load-fill');
const LD_PCT    = document.getElementById('load-pct');
const TH_FILL   = document.getElementById('thermal-fill');
const TH_PCT    = document.getElementById('thermal-pct');
const BOOST_CAP = document.getElementById('boost-cap');
const CEIL_VAL  = document.getElementById('ceiling-val');
const POS_VAL   = document.getElementById('position-val');

function barColor(frac, lo, hi) {
  if (frac < lo) return '#00ffcc';
  if (frac < hi) return '#ffa000';
  return '#ff4040';
}

function cardinalDir(deg) {
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  return dirs[Math.round(deg / 45) % 8];
}

function render(d) {
  const speed  = d.speed  || 0;
  const vspeed = d.vspeed || 0;
  const alt    = d.altitude || 0;
  const hdg    = d.heading  || 0;
  const energy = d.hover_energy || 0;
  const load   = d.load_ratio  || 0;
  const therm  = d.thermal     || 0;

  drawGauge(speed);

  // Mode badge
  const mode = d.mode || 'GROUNDED';
  MODE.textContent = mode;
  MODE.className   = mode;

  // Altitude
  ALT_VAL.textContent = alt.toFixed(1) + ' m';

  // Vertical speed
  const vs = vspeed.toFixed(1);
  if (vspeed > 0.3) {
    VSPD_VAL.textContent = '+' + vs + ' m/s';
    VSPD_VAL.className = 'readout-val climbing';
  } else if (vspeed < -0.3) {
    VSPD_VAL.textContent = vs + ' m/s';
    VSPD_VAL.className = 'readout-val descending';
  } else {
    VSPD_VAL.textContent = '±0.0 m/s';
    VSPD_VAL.className = 'readout-val neutral';
  }

  // Heading
  HDG_VAL.textContent = hdg.toFixed(0) + '°  ' + cardinalDir(hdg);

  // VSI bar — bidirectional, center = 0
  const vsiFrac = Math.min(Math.abs(vspeed) / VSI_MAX, 1.0);
  const vsiBgColor = vspeed > 0 ? '#00ffcc' : '#ffa000';
  VSI_FILL.style.background = vsiBgColor;
  if (vspeed >= 0) {
    VSI_FILL.style.left  = '50%';
    VSI_FILL.style.right = 'auto';
    VSI_FILL.style.width = (vsiFrac * 50) + '%';
  } else {
    VSI_FILL.style.right = '50%';
    VSI_FILL.style.left  = 'auto';
    VSI_FILL.style.width = (vsiFrac * 50) + '%';
  }

  // Hover energy bar
  const enPct = Math.min(energy, 1.0);
  EN_FILL.style.width = (enPct * 100) + '%';
  EN_FILL.style.backgroundColor = barColor(enPct, 0.6, 0.3) === '#00ffcc' ? '#00ffcc'
    : energy > 0.6 ? '#00ffcc' : energy > 0.3 ? '#ffa000' : '#ff4040';
  EN_PCT.textContent = Math.round(energy * 100) + '%';
  // Fix bar color (barColor returns wrong direction for energy - more is better)
  EN_FILL.style.backgroundColor = energy > 0.6 ? '#00ffcc' : energy > 0.3 ? '#ffa000' : '#ff4040';

  // Load bar
  const ldPct = Math.min(load, 1.0);
  LD_FILL.style.width = (ldPct * 100) + '%';
  LD_FILL.style.backgroundColor = load < 0.5 ? '#00ffcc' : load < 0.8 ? '#ffa000' : '#ff4040';
  LD_PCT.textContent = Math.round(load * 100) + '%';

  // Thermal bar
  const thPct = Math.min(therm, 1.0);
  TH_FILL.style.width = (thPct * 100) + '%';
  TH_FILL.style.backgroundColor = therm < 0.4 ? '#00ffcc' : therm < 0.7 ? '#ffa000' : '#ff4040';
  TH_PCT.textContent = Math.round(therm * 100) + '%';

  // Footer
  BOOST_CAP.textContent = (d.boost_speed || 0).toFixed(0) + ' m/s';
  CEIL_VAL.textContent  = d.ceiling || '∞';
  POS_VAL.textContent   = (d.x || 0).toFixed(0) + ' / ' + (d.z || 0).toFixed(0);
}

// Draw initial empty gauge
drawGauge(0);

// ── WebSocket ────────────────────────────────────────────────────────────────

let ws;

function setStatus(cls, text) {
  STATUS.className   = cls;
  STATUS.textContent = text;
}

function connect() {
  setStatus('', 'CONNECTING…');
  ws = new WebSocket('ws://localhost:9787');
  ws.binaryType = 'arraybuffer';

  ws.addEventListener('open', () => setStatus('connected', 'CONNECTED'));

  ws.addEventListener('close', () => {
    setStatus('disconnected', 'DISCONNECTED — retrying in 2s…');
    setTimeout(connect, 2000);
  });

  ws.addEventListener('error', () => {});

  ws.addEventListener('message', e => {
    const text = typeof e.data === 'string' ? e.data
               : new TextDecoder().decode(e.data);
    const msg = JSON.parse(text);
    if (msg.type === 'flight_data') render(msg);
  });
}

connect();
</script>
</body>
</html>
